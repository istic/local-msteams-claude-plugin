[project]
name = "teams-log-export"
version = "1.0.0"
description = "Export Microsoft Teams chat and channel logs"
authors = [
    {name = "Nicholas Avenell"}
]
requires-python = ">=3.10"
dependencies = [
    "brotli>=1.2.0,<2.0.0",
    "mcp>=1.0.0",
    "ccl_chromium_reader @ git+https://github.com/cclgroupltd/ccl_chromium_reader.git",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["teams_log_export", "teams_log_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501", # line too long — ruff-format handles wrapping
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
