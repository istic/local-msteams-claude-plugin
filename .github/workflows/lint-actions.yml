name: "[Lint] GitHub Actions"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions: read-all

jobs:
  actionlint:
    uses: istic/shared-workflows/.github/workflows/lint-actions.yml@main
