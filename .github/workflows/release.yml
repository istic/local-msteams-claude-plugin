name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy_version:
        description: "Version to deploy (e.g. v1.2.3)"
        required: true
  workflow_call:
    inputs:
      deploy_version:
        description: "Tag to deploy"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.deploy_version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version from tag
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          python3 -c "
          import json, pathlib
          f = pathlib.Path('manifest.json')
          d = json.loads(f.read_text())
          d['version'] = '$VERSION'
          f.write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')
          "

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ --ignore=tests/test_integration.py -q

      - name: Build artifacts
        run: uv run python build_artifacts.py

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: true
          make_latest: false
          files: |
            build/teams-log.zip
            build/teams-log.mcpb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        run: gh release edit ${{ steps.tag.outputs.tag }} --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
